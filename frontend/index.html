<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Recursos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; }
    .metric-value { font-size: 1.6rem; font-weight: 700; }
    .chart-container { position: relative; height: 220px; width: 100%; }
  </style>
</head>
<body class="p-2 p-md-4">
  <div class="container-fluid" style="max-width: 1100px;">
    
    <!-- Encabezado -->
    <header class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary">
      <div>
        <h4 class="fw-bold mb-0">🖥️ Monitor de Sistema</h4>
        <small class="text-secondary" id="hostTitle">Conectando...</small>
      </div>
      <div>
        <span id="badgeStatus" class="badge text-bg-secondary">Desconectado</span>
      </div>
    </header>

    <!-- Fila 1: Información General del Host -->
    <div class="row g-2 g-md-3 mb-3">
      <div class="col-12 col-md-4">
        <div class="card p-3 h-100">
          <small class="text-secondary text-uppercase fw-semibold">Sistema</small>
          <div class="fw-bold mt-1 text-truncate" id="distroText">-</div>
          <small class="text-secondary text-truncate" id="kernelText">-</small>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card p-3 h-100">
          <small class="text-secondary text-uppercase fw-semibold">Procesador</small>
          <div class="fw-bold mt-1 text-truncate" id="cpuModelText">-</div>
          <small class="text-secondary" id="cpuCoresText">-</small>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card p-3 h-100">
          <small class="text-secondary text-uppercase fw-semibold">Uptime & Swap Base</small>
          <div class="fw-bold mt-1 text-success" id="uptimeText">0h 0m</div>
          <small class="text-secondary">Swap total: <span id="swapTotalText">-</span></small>
        </div>
      </div>
    </div>

    <!-- Fila 2: Indicadores en Tiempo Real (2 columnas en cel, 4 en desktop) -->
    <div class="row g-2 g-md-3 mb-3">
      <!-- CPU -->
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center h-100">
          <small class="text-secondary text-uppercase fw-semibold">CPU</small>
          <div class="metric-value text-warning my-1" id="cpuLoad">0%</div>
          <div class="progress mb-2" style="height: 5px;">
            <div id="cpuBar" class="progress-bar bg-warning" style="width: 0%"></div>
          </div>
          <small class="text-secondary" id="cpuLoadAvg">Avg: -</small>
        </div>
      </div>

      <!-- RAM -->
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center h-100">
          <small class="text-secondary text-uppercase fw-semibold">RAM</small>
          <div class="metric-value text-info my-1" id="ramLoad">0%</div>
          <div class="progress mb-2" style="height: 5px;">
            <div id="ramBar" class="progress-bar bg-info" style="width: 0%"></div>
          </div>
          <small class="text-secondary" id="ramDetail">0 / 0 GB</small>
        </div>
      </div>

      <!-- Disco -->
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center h-100">
          <small class="text-secondary text-uppercase fw-semibold">Disco (<span id="diskMount">/</span>)</small>
          <div class="metric-value text-primary my-1" id="diskLoad">0%</div>
          <div class="progress mb-2" style="height: 5px;">
            <div id="diskBar" class="progress-bar bg-primary" style="width: 0%"></div>
          </div>
          <small class="text-secondary" id="diskDetail">0 / 0 GB</small>
        </div>
      </div>

      <!-- Red -->
      <div class="col-6 col-md-3">
        <div class="card p-3 text-center h-100">
          <small class="text-secondary text-uppercase fw-semibold">Red (KB/s)</small>
          <div class="mt-2">
            <span class="text-success fw-bold">↓ <span id="netRx">0.0</span></span>
          </div>
          <div>
            <span class="text-warning fw-bold">↑ <span id="netTx">0.0</span></span>
          </div>
        </div>
      </div>
    </div>

    <!-- Fila 3: Gráfico y Tabla -->
    <div class="row g-2 g-md-3">
      <!-- Gráfico -->
      <div class="col-12 col-lg-7">
        <div class="card p-3 h-100">
          <div class="fw-semibold mb-2">Uso Histórico (CPU vs RAM)</div>
          <div class="chart-container">
            <canvas id="resourceChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Procesos -->
      <div class="col-12 col-lg-5">
        <div class="card p-3 h-100">
          <div class="fw-semibold mb-2">Top 5 Procesos (CPU)</div>
          <div class="table-responsive">
            <table class="table table-sm table-dark align-middle mb-0" style="font-size: 0.85rem;">
              <thead>
                <tr class="text-secondary">
                  <th>PID</th>
                  <th>Nombre</th>
                  <th class="text-end">CPU</th>
                  <th class="text-end">RAM</th>
                </tr>
              </thead>
              <tbody id="processList">
                <tr><td colspan="4" class="text-center text-secondary py-2">Esperando datos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
